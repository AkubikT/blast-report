<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blast Report</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2b705">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#e9ecee;--card:#fff;--ink:#14181c;--mut:#5a656e;--line:#c5cbd0;--fld:#f4f6f7;--acc:#f2b705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1215;--card:#1a1f24;--ink:#eef1f3;--mut:#9aa5ae;--line:#38414a;--fld:#11151a}}
:root[data-theme="dark"]{--bg:#0f1215;--card:#1a1f24;--ink:#eef1f3;--mut:#9aa5ae;--line:#38414a;--fld:#11151a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header,main{max-width:720px;margin:auto;padding:0 12px}
header{padding-top:16px}
h1{font:700 32px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
header p{margin:2px 0 10px;color:var(--mut);font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:12px;margin:0 0 12px}
h2{font:700 20px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0 0 10px}
h3{font:600 15px Barlow,system-ui,sans-serif;margin:0 0 4px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.s2,.sub{grid-column:1/-1}
.sub{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.hint{margin:0;color:var(--mut);font-size:14px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:5px;padding:10px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[readonly]{opacity:.75}
.c{display:flex;align-items:center;gap:10px;min-height:38px}
.c input{width:22px;height:22px;accent-color:var(--ink)}
.pad{display:block;width:100%;height:auto;background:#fff;border:2px solid var(--ink);border-radius:4px;touch-action:none}
.pad.grid{background-image:linear-gradient(#d3d7da 1px,transparent 1px),linear-gradient(90deg,#d3d7da 1px,transparent 1px);background-size:2.5% 5%}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font:600 16px Barlow,system-ui,sans-serif;min-height:46px;padding:0 16px;border-radius:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.sw{width:38px;min-height:38px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:3}
.bar .p{flex:1;background:var(--acc);color:#14181c;border-color:#14181c}
.bar button{padding:0 12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px;border-radius:6px;text-align:center;z-index:9}
.hide{display:none}
#hist{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:6;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
#hist>*{max-width:720px;margin-left:auto;margin-right:auto}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hash{font-family:ui-monospace,monospace;word-break:break-all;font-size:12px}
#histBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:4;min-height:36px;padding:0 12px;font-size:13px}
#pv{position:fixed;inset:0;z-index:7;background:var(--bg);display:flex;flex-direction:column}
#pv .hh{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;margin:0}
#pv iframe{flex:1;width:100%;border:0;background:#fff}
.screen.hide{display:none}
.companyCard{display:flex;gap:10px;align-items:center}
.companyCard img{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.logo-prev{max-width:140px;max-height:80px;display:block;margin:8px 0;border:1px solid var(--line);border-radius:4px;background:#fff;object-fit:contain}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tab{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);white-space:nowrap;min-height:38px}
.tab.on{border-color:var(--ink);background:var(--acc)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:96px;height:96px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;min-height:24px;padding:0 8px;font-size:12px;border-radius:4px}
.row4{display:grid;grid-template-columns:auto 1fr 1fr 2fr;gap:6px;align-items:center;padding:5px 0}
.row4 input[type=text]{padding:6px;min-height:36px;font-size:13px}
.tasklabel{grid-column:1/-1;font:600 13px Barlow,system-ui,sans-serif;margin-top:8px}
</style></head>
<body>
<button id="histBtn">History</button>

<div id="scr-setup" class="screen">
 <header><h1>Blast Report</h1><p>Select the company and project to begin.</p></header>
 <main id="setup"></main>
</div>

<div id="scr-report" class="screen hide">
 <header><h1>Blast Report</h1><p id="ctx" class="hint"></p></header>
 <main id="form"></main>
 <div class="bar"><button id="rBack">Back</button><button id="rNew">New report</button><button class="p" id="rNext">Continue</button></div>
</div>

<div id="scr-extras" class="screen hide">
 <header><h1>Additional documents</h1><p class="hint">Fill in what applies, then finalize.</p></header>
 <main id="extras"></main>
 <div class="bar"><button id="eBack">Back</button><button id="ePrev">Preview</button><button class="p" id="go">Finalize PDF</button></div>
</div>

<div id="hist" class="hide"></div>
<div id="toast" class="hide" role="status"></div>

function pad(id,w,h,cols){
 const c=el('canvas',{width:w,height:h,class:'pad'+(id=='sk'?' grid':'')}),x=c.getContext('2d');let col='#111',d=0,lx=0,ly=0;
 const clr=()=>x.clearRect(0,0,w,h);
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*h/r.height]};
 c.onpointerdown=e=>{e.preventDefault();d=1;c.setPointerCapture(e.pointerId);[lx,ly]=pt(e);x.fillStyle=col;x.beginPath();x.arc(lx,ly,1.6,0,7);x.fill()};
 c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.strokeStyle=col;x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py};
 c.onpointerup=c.onpointercancel=()=>{d=0;later()};
 pads[id]={c,clr,load:s=>{const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=s}};
 const t=el('div',{class:'tools'});
 cols.forEach((k,i)=>{const b=el('button',{class:'sw'+(i?'':' on'),type:'button','aria-label':'Pen colour '+(i+1)});b.style.background=k;b.onclick=()=>{col=k;t.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b))};t.append(b)});
 const cb=el('button',{type:'button'},'Clear');cb.onclick=()=>{clr();later()};t.append(cb);
 return el('div',{class:'s2'},c,t)}

/* ---------- Sketch editor: editable objects (pen / arrow+label / text / hole / move-delete) ---------- */
function sketchEditor(){
 const W=1400,H=686;
 const box=el('div',{style:'position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:4px;background:#fff;touch-action:none;aspect-ratio:'+W+'/'+H});
 const canvas=el('canvas',{width:W,height:H,class:'pad grid'});
 canvas.style.border='0';canvas.style.borderRadius='0';canvas.style.height='100%';canvas.style.transformOrigin='0 0';
 const north=el('img',{src:IMG.compass,alt:'North',style:'position:absolute;top:4px;right:4px;width:11%;height:auto;pointer-events:none;opacity:.9'});
 box.append(canvas,north);
 const ctx=canvas.getContext('2d');
 function measure(o){ctx.font=(W*0.022*(SK.compact?0.6:1))+'px Barlow, sans-serif';return ctx.measureText(o.text||'').width}
 function bbox(o){
  if(o.type=='stroke'){const xs=o.pts.map(p=>p.x),ys=o.pts.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs)||1,h:Math.max(...ys)-Math.min(...ys)||1}}
  if(o.type=='arrow')return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1)||1,h:Math.abs(o.y2-o.y1)||1};
  if(o.type=='text')return{x:o.x,y:o.y-W*0.02,w:measure(o)||W*0.05,h:W*0.026};
  const r=W*0.014*(SK.compact?0.6:1);return{x:o.x-r,y:o.y-r,w:r*2,h:r*2}}
 function drawArrow(c,x1,y1,x2,y2,color){
  c.strokeStyle=color;c.lineWidth=W*0.0025;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  const ang=Math.atan2(y2-y1,x2-x1),hl=W*0.02;
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-hl*Math.cos(ang-Math.PI/6),y2-hl*Math.sin(ang-Math.PI/6));c.lineTo(x2-hl*Math.cos(ang+Math.PI/6),y2-hl*Math.sin(ang+Math.PI/6));c.closePath();c.fillStyle=color;c.fill()}
 function drawObj(c,o,selected){
  const cm=SK.compact?0.6:1;
  c.lineCap='round';c.lineJoin='round';
  if(o.type=='stroke'){c.strokeStyle=o.color;c.lineWidth=W*0.0075;c.beginPath();o.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}
  else if(o.type=='arrow'){drawArrow(c,o.x1,o.y1,o.x2,o.y2,o.color);if(o.label){c.fillStyle=o.color;c.font=(W*0.02*cm)+'px Barlow, sans-serif';c.fillText(o.label,(o.x1+o.x2)/2+6,(o.y1+o.y2)/2-6)}}
  else if(o.type=='text'){c.fillStyle=o.color;c.font=(W*0.022*cm)+'px Barlow, sans-serif';c.fillText(o.text,o.x,o.y)}
  else if(o.type=='hole'){const r=W*0.014*cm;c.strokeStyle=o.color;c.lineWidth=W*0.0025;c.beginPath();c.arc(o.x,o.y,r,0,7);c.stroke();
   c.fillStyle=o.color;c.font=(W*0.016*cm)+'px Barlow, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(o.label||'',o.x,o.y);c.textAlign='left';c.textBaseline='alphabetic'}
  if(selected){c.save();c.strokeStyle='#00b3ff';c.setLineDash([6,4]);c.lineWidth=2;const b=bbox(o);c.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);c.restore()}}
 function redraw(){ctx.clearRect(0,0,W,H);SK.objs.forEach((o,i)=>drawObj(ctx,o,i===SK.sel));if(SK._preview)drawObj(ctx,SK._preview,false);if(SK.cur)drawObj(ctx,SK.cur,false)}
 function hit(p){for(let i=SK.objs.length-1;i>=0;i--){const b=bbox(SK.objs[i]);if(p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8)return i}return -1}
 function ptFromEvent(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
 function offsetFor(o,p){if(o.type=='stroke')return{dx:p.x-o.pts[0].x,dy:p.y-o.pts[0].y,base:o.pts.map(q=>({x:q.x,y:q.y}))};
  if(o.type=='arrow')return{dx:p.x-o.x1,dy:p.y-o.y1,x1:o.x1,y1:o.y1,x2:o.x2,y2:o.y2};

 F(17,1);T('Blast Preparation',X1,15,{align:'right'});

 const cols=[[X0,4.4],[X0+4.4,17],[X0+21.4,20],[X0+41.4,71],[X0+112.4,X1-(X0+112.4)]];
 let y=26,rh=9.4;
 F(7.5,1);T('Time',cols[1][0]+1,y-1);T('Date',cols[2][0]+1,y-1);T('Task',cols[3][0]+1,y-1);T('Notes / Delegated to',cols[4][0]+1,y-1);
 ln(X0,y+.6,X1,y+.6,.4);y+=3;

 tasks.forEach((t,i)=>{
  const ry=y+i*rh;

  F(8,1);T(t.task,cols[3][0]+1,ry+5.6);F(8);T(t.notes||'',cols[4][0]+1,ry+5.6);
  ln(X0,ry+rh,X1,ry+rh,.2,150)});
 cols.forEach(([cx])=>ln(cx,y,cx,y+tblH,.2,150));ln(X1,y,X1,y+tblH,.2,150);
 F(6.5);T('Report ID '+(v._id||''),X0,278)}
function drawPhotoPage(doc,photo,title){
 doc.addPage();
 const X0=10.3,X1=206,top=14;
 doc.setFont('helvetica','bold').setFontSize(13).setTextColor(0);doc.text(title,X0,top);
 const maxW=X1-X0,maxH=279-top-14;
 let w=photo.w||maxW,h=photo.h||maxH;const sc=Math.min(maxW/w,maxH/h);w*=sc;h*=sc;
 const x=X0+(maxW-w)/2,y=top+6;
 try{doc.addImage(photo.url,imgFmt(photo.url),x,y,w,h)}catch(e){}
 doc.setDrawColor(150);doc.setLineWidth(.2);doc.rect(x,y,w,h)}
function paginateText(doc,text,title){
 doc.addPage();
 const X0=10.3,X1=206,top=14,maxY=279-14;let y=top;
 doc.setFont('helvetica','bold').setFontSize(13).setTextColor(0);doc.text(title,X0,y);y+=8;
 doc.setFont('helvetica','normal').setFontSize(10);
 const lines=doc.splitTextToSize(text,X1-X0);
 lines.forEach(l=>{if(y>maxY){doc.addPage();y=top;doc.setFont('helvetica','normal').setFontSize(10)}doc.text(l,X0,y);y+=4.6})}
function finalizeDoc(v,ex){
 const doc=build(v);
 if(v.c1)drawBlastRecord(doc,v,ex.blastRecord||defaultBR());
 if(v.c2&&ex.drillPhotos&&ex.drillPhotos.length)ex.drillPhotos.forEach(p=>drawPhotoPage(doc,p,'Drill report'));
 if(v.c3&&ex.notes&&ex.notes.trim())paginateText(doc,ex.notes,'Additional notes');
 if(v.c4&&ex.otherPhotos&&ex.otherPhotos.length)ex.otherPhotos.forEach(p=>drawPhotoPage(doc,p,v.docsOther||'Other docs'));
 return doc}

/* ---------- Storage: reports, companies, projects ---------- */
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',await b.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('blast',2);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('reports'))d.createObjectStore('reports',{keyPath:'id'});if(!d.objectStoreNames.contains('companies'))d.createObjectStore('companies',{keyPath:'id'});if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(store,mode,f)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(store,mode),q=f(t.objectStore(store));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};
async function out(b,n){const f=new File([b],n,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name=='AbortError')return}
 const a=el('a',{href:URL.createObjectURL(b),download:n});document.body.append(a);a.click();a.remove()}

chkf.onchange=async()=>{const f=chkf.files[0];if(!f)return;const hh=await sha(f),m=(await tx('reports','readonly',s=>s.getAll())).find(r=>r.hash==hh);toast(m?'Match: identical to saved report '+m.id:'No match: not an unchanged copy of any saved report');chkf.value=''};

   const t=el('div',{class:'tools'});
   t.append(btn('Open / share',()=>out(r.pdf,r.name)),btn('Verify',async()=>toast(await sha(r.pdf)==r.hash?'Verified: file matches its stored fingerprint':'WARNING: file does not match its fingerprint')),
    btn('Correct',()=>{fullReset();showScreen('scr-setup');/* company/project must be re-picked for the correction */K$('ref').value=r.id+' (Blast #'+(r.blastNo||'-')+', '+(r.date||'-')+')';upd();later();H.classList.add('hide');toast('New report linked to '+r.id+' as a correction. Review every field.')}));
   c.append(t);return c}));

/* ---------- Image helpers ---------- */
function fileToImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function compress(file,maxDim=1400,q=.82){
 const im=await fileToImage(file);let w=im.width,h=im.height;const sc=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
 return{url:c.toDataURL('image/jpeg',q),w,h}}

let ST={company:null,project:null,blastNo:null},setupUI={mode:'company-list',editing:null};

async function renderSetup(){

 else if(!ST.project){await renderProjectStep(root)}

/* ---------- Stage 3: extra documents ---------- */
function defaultBR(){return{blaster:'',blastDate:'',tasks:TASKS.map(t=>({task:t,done:false,time:'',date:'',notes:''}))}}
function defaultEX(){return{tabs:[],active:null,blastRecord:defaultBR(),drillPhotos:[],notes:'',otherPhotos:[]}}
let EX=defaultEX();const EXK='blastExtras';
let tm2;const later2=()=>{clearTimeout(tm2);tm2=setTimeout(saveEX,500)};
function saveEX(){try{localStorage.setItem(EXK,JSON.stringify(EX))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(EXK)||'null');if(s)EX={...defaultEX(),...s,blastRecord:{...defaultBR(),...(s.blastRecord||{})}}}catch(e){}

 const s=el('div',{});
 const bI=el('input',{type:'text'});bI.value=EX.blastRecord.blaster||'';bI.oninput=()=>{EX.blastRecord.blaster=bI.value;later2()};
 const dI=el('input',{type:'date'});dI.value=EX.blastRecord.blastDate||'';dI.oninput=()=>{EX.blastRecord.blastDate=dI.value;later2()};
 s.append(el('section',{class:'sec'},el('h2',{},'Blast Preparation'),el('div',{class:'g'},
  el('label',{class:'f'},el('span',{},'Blaster'),bI),el('label',{class:'f'},el('span',{},'Blast date'),dI))));
 const list=el('section',{class:'sec'},el('h2',{},'Tasks'));
 EX.blastRecord.tasks.forEach(t=>{
  const cbI=el('input',{type:'checkbox'});cbI.checked=!!t.done;cbI.onchange=()=>{t.done=cbI.checked;later2()};
  const tI=el('input',{type:'time'});tI.value=t.time||'';tI.oninput=()=>{t.time=tI.value;later2()};
  const dI2=el('input',{type:'date'});dI2.value=t.date||'';dI2.oninput=()=>{t.date=dI2.value;later2()};
  const nI=el('input',{type:'text',placeholder:'Notes / delegated to'});nI.value=t.notes||'';nI.oninput=()=>{t.notes=nI.value;later2()};
  list.append(el('div',{class:'tasklabel'},t.task),el('div',{class:'row4'},cbI,tI,dI2,nI))});

 return el('div',{},el('section',{class:'sec'},el('h2',{},'Additional notes'),el('p',{class:'hint'},'This text is appended as extra page(s) in the PDF.'),ta))}
function photoTab(key,label){
 const sec1=el('section',{class:'sec'},el('h2',{},label));
 const thumbs=el('div',{class:'thumbs'});
 function draw(){thumbs.replaceChildren();(EX[key]||[]).forEach((p,i)=>{
  const d=el('div',{class:'thumb'},el('img',{src:p.url}));
  const rb=el('button',{type:'button'},'✕');rb.onclick=()=>{EX[key].splice(i,1);later2();draw()};d.append(rb);thumbs.append(d)})}
 draw();
 const fi=el('input',{type:'file',accept:'image/*',capture:'environment',class:'hide'});
 fi.onchange=async()=>{const f=fi.files[0];fi.value='';if(!f)return;
  if((EX[key]||[]).length>=2){toast('Maximum 2 photos — remove one first');return}
  try{const r=await compress(f,1500,.82);EX[key]=EX[key]||[];EX[key].push(r);later2();draw()}catch(e){toast('Could not read that photo')}};
 sec1.append(thumbs,btn('Add photo',()=>fi.click()),fi);

function renderExtras(){

 if(!EX.tabs.length){root.append(el('p',{class:'hint'},'No additional documents were selected on the Blast Report screen. Tap "Finalize PDF" to generate the report.'));return}
 if(!EX.active||!EX.tabs.includes(EX.active))EX.active=EX.tabs[0];
 const LBL={br:'Blast Record',drill:'Drill report',notes:'Additional notes',other:'Other docs'};
 const tb=el('div',{class:'tabs'});
 EX.tabs.forEach(k=>{const b=el('button',{type:'button',class:'tab'+(k==EX.active?' on':'')},LBL[k]);b.onclick=()=>{EX.active=k;renderExtras()};tb.append(b)});

/* ---------- Navigation & finalize ---------- */
function fullReset(){reset();EX=defaultEX();try{localStorage.removeItem(EXK)}catch(e){}ST={company:null,project:null,blastNo:null};setupUI={mode:'company-list',editing:null};showScreen('scr-setup');renderSetup()}

 EX.tabs=tabs;EX.blastRecord.blaster=EX.blastRecord.blaster||v.blaster;EX.blastRecord.blastDate=EX.blastRecord.blastDate||v.date;

let fin=0;$('#go').onclick=async function(){
 if(!fin){fin=1;this.textContent='Tap again to FINALIZE (cannot be edited)';setTimeout(()=>{fin=0;this.textContent='Finalize PDF'},4000);return}
 fin=0;this.textContent='Finalize PDF';
 try{
  const v=collect();v._companyLogo=ST.company?ST.company.logo:null;
  v._id='BR-'+Date.now().toString(36).toUpperCase();v._created=new Date().toISOString();
  const nm=('Blast_Report_'+(v.date||'nodate')+(v.blastNo?'_'+v.blastNo:'')+'_'+v._id+'.pdf').replace(/[^\w.-]+/g,'_');
  const doc=finalizeDoc(v,EX),blob=doc.output('blob'),hash=await sha(blob);
  await tx('reports','readwrite',s=>s.add({id:v._id,created:v._created,date:v.date,blastNo:v.blastNo,project:v.project,company:ST.company?ST.company.name:'',ref:v.ref,name:nm,hash,pdf:blob,data:v}));
  if(ST.project){const n=parseInt(String(v.blastNo).replace(/[^\d]/g,''),10);if(!isNaN(n)&&n>(ST.project.counter||0)){ST.project.counter=n;await tx('projects','readwrite',s=>s.put(ST.project))}}
  const savedId=v._id;fullReset();toast('Saved to history: '+savedId);await out(blob,nm)
 }catch(e){toast('Error: '+(e&&e.message||e))}};

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
seedIfEmpty().finally(()=>{showScreen('scr-setup');renderSetup()});
