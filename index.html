<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blast Report</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2b705">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#e9ecee;--card:#fff;--ink:#14181c;--mut:#5a656e;--line:#c5cbd0;--fld:#f4f6f7;--acc:#f2b705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1215;--card:#1a1f24;--ink:#eef1f3;--mut:#9aa5ae;--line:#38414a;--fld:#11151a}}
:root[data-theme="dark"]{--bg:#0f1215;--card:#1a1f24;--ink:#eef1f3;--mut:#9aa5ae;--line:#38414a;--fld:#11151a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header,main{max-width:720px;margin:auto;padding:0 12px}
header{padding-top:16px}
h1{font:700 32px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
header p{margin:2px 0 10px;color:var(--mut);font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:12px;margin:0 0 12px}
h2{font:700 20px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0 0 10px}
h3{font:600 15px Barlow,system-ui,sans-serif;margin:0 0 4px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.s2,.sub{grid-column:1/-1}
.sub{border-top:1px dashed var(--line);padding-top:8px}
.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.hint{margin:0;color:var(--mut);font-size:14px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:5px;padding:10px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[readonly]{opacity:.75}
.c{display:flex;align-items:center;gap:10px;min-height:38px}
.c input{width:22px;height:22px;accent-color:var(--ink)}
.pad{display:block;width:100%;height:auto;background:#fff;border:2px solid var(--ink);border-radius:4px;touch-action:none}
.pad.grid{background-image:linear-gradient(#d3d7da 1px,transparent 1px),linear-gradient(90deg,#d3d7da 1px,transparent 1px);background-size:2.5% 5%}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px}
button{font:600 16px Barlow,system-ui,sans-serif;min-height:46px;padding:0 16px;border-radius:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.sw{width:38px;min-height:38px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar .p{flex:1;background:var(--acc);color:#14181c;border-color:#14181c}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px;border-radius:6px;text-align:center}
.hide{display:none}
#toast{z-index:9}
.bar button:not(.p){padding:0 12px}
.tools{flex-wrap:wrap}
#hist{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:5;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
#hist>*{max-width:720px;margin-left:auto;margin-right:auto}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hash{font-family:ui-monospace,monospace;word-break:break-all}
</style></head>
<body>
<header><h1>Blast Report</h1><p>Your draft saves on this device as you type.</p></header>
<main id="form"></main>
<div class="bar"><button class="p" id="go">Finalize PDF</button><button id="hbtn">History</button><button id="new">New report</button></div>
<div id="toast" class="hide" role="status"></div>
<script>
const $=s=>document.querySelector(s),pads={},K='blastDraft';
const ROCKS={Igneous:["Andesite","Anorthosite","Basalt","Diabase (dolerite)","Diorite","Gabbro","Granite","Granodiorite","Kimberlite","Monzonite","Pegmatite","Peridotite","Rhyolite","Syenite","Tonalite","Tuff"],
Sedimentary:["Chert","Coal","Conglomerate","Dolostone","Greywacke","Gypsum / Anhydrite","Iron formation","Limestone","Mudstone","Sandstone","Shale","Siltstone"],
Metamorphic:["Amphibolite","Argillite","Gneiss","Greenstone","Hornfels","Marble","Metagreywacke","Phyllite","Quartzite","Schist","Slate"],
Other:["Mixed / interbedded","Overburden / till","Other"]};
const WX=['Clear','Cloudy','Partially cloudy','Overcast','Drizzle','Light rain','Rain','Snow','Blizzard'],WD=['N','NE','E','SE','S','SW','W','NW'],PR=['Single','Double','Triple'],
LAYERS=['Overburden','Stemming','Main charge','Primer','Spacers / Deck','Main charge','Primer','Subdrilling'];
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k=='class'?e.className=a[k]:e.setAttribute(k,a[k]);c.forEach(x=>e.append(x));return e};
let tm,tt;const later=()=>{clearTimeout(tm);tm=setTimeout(save,500)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hide'),4000)};
function fld(id,label,type='text',opt,span){
 const l=el('label',{class:'f'+(span?' s2':'')},el('span',{},label));let i;
 if(type=='sel'){i=el('select');i.append(el('option',{value:''},'Select'));const add=(p,a)=>a.forEach(o=>p.append(el('option',{},o)));
  Array.isArray(opt)?add(i,opt):Object.entries(opt).forEach(([g,a])=>{const og=el('optgroup',{label:g});add(og,a);i.append(og)})}
 else if(type=='area')i=el('textarea',{rows:5});
 else{i=el('input',{type:'text',autocomplete:'off'});if(type=='num')i.inputMode='decimal';if(opt)i.placeholder=opt}
 i.dataset.k=id;l.append(i);return l}
const N=(a,b)=>fld(a,b,'num');
const chk=(id,t)=>{const l=el('label',{class:'c'}),i=el('input',{type:'checkbox'});i.dataset.k=id;l.append(i,el('span',{},t));return l};
function sec(t,...k){const s=el('section',{class:'sec'},el('h2',{},t)),g=el('div',{class:'g'});k.forEach(x=>g.append(x));s.append(g);$('#form').append(s)}
function pad(id,w,h,cols){
 const c=el('canvas',{width:w,height:h,class:'pad'+(id=='sk'?' grid':'')}),x=c.getContext('2d');let col='#111',d=0,lx=0,ly=0;
 const clr=()=>x.clearRect(0,0,w,h);
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*h/r.height]};
 c.onpointerdown=e=>{e.preventDefault();d=1;c.setPointerCapture(e.pointerId);[lx,ly]=pt(e);x.fillStyle=col;x.beginPath();x.arc(lx,ly,1.6,0,7);x.fill()};
 c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.strokeStyle=col;x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py};
 c.onpointerup=c.onpointercancel=()=>{d=0;later()};
 pads[id]={c,clr,load:s=>{const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=s}};
 const t=el('div',{class:'tools'});
 cols.forEach((k,i)=>{const b=el('button',{class:'sw'+(i?'':' on'),type:'button','aria-label':'Pen colour '+(i+1)});b.style.background=k;b.onclick=()=>{col=k;t.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b))};t.append(b)});
 const cb=el('button',{type:'button'},'Clear');cb.onclick=()=>{clr();later()};t.append(cb);
 return el('div',{class:'s2'},c,t)}
const subs=(n,name,mk)=>Array.from({length:n},(_,j)=>{const i=j+1,s=el('div',{class:'sub'},el('h3',{},name+' '+i)),g=el('div',{class:'g'});mk(i).forEach(f=>g.append(f));s.append(g);return s});

const REF=fld('ref','Correction of report','text',null,1);REF.querySelector('input').readOnly=true;
sec('Blast',fld('date','Date','text','YYYY-MM-DD'),fld('time','Time','text','HH:MM'),fld('blastNo','Blast #'),fld('blaster','Blaster'),fld('project','Project','text',null,1),REF);
sec('Rock and pattern',fld('material','Type of material','sel',ROCKS,1),fld('matOther','Specify rock type','text',null,1),fld('pattern','Pattern'),fld('holes','Number of holes','num'),N('rows','Number of rows'),N('depth','Average depth (m)'),N('diam','Hole diameter (mm)'),N('volume','Overall rock volume (m³)'));
sec('Weather',fld('weather','Weather','sel',WX,1),fld('windDir','Wind direction','sel',WD),N('windSpd','Wind speed (km/h)'));
sec('Seismograph',...subs(4,'Seismograph',i=>[N('sd'+i,'Distance (m)'),fld('st'+i,'Details'),N('sv'+i,'Vibrations (mm/s)'),N('sb'+i,'Decibels (dB)')]));
const pf=fld('pf','Powder factor (kg/m³, auto)');pf.querySelector('input').readOnly=true;
sec('Initiation and loading',fld('initSys','Initiation system','text',null,1),N('maxW','Max weight × hole (kg)'),N('totW','Total weight explosives (kg)'),fld('prim','Priming','sel',['Single','Double','Triple','Other']),fld('primOther','Priming other (specify)'),N('collar','Collar (m)'),fld('stem','Stemming','sel',['¼','½','¾','Other']),fld('stemOther','Stemming other (specify)'),fld('matting','Matting'),N('mattQty','Matting qty'),pf);
sec('Explosives',...subs(8,'Explosive',i=>[fld('en'+i,'Explosive name'),fld('ec'+i,'Characteristics'),N('eq'+i,'Qty')]));
const lay=k=>{const d=el('div',{},el('h3',{},'Type '+k));LAYERS.forEach((t,i)=>d.append(chk(k+i,t)));return d};
sec('Charge layout per hole',lay('A'),lay('B'));
sec('Helpers',...[1,2,3,4].map(i=>fld('h'+i,'Helper '+i)));
sec('Sketch of shot / layout',el('p',{class:'s2 hint'},'Include nearest building, North, timing and sequence.'),pad('sk',800,392,['#111','#c62828','#1565c0']));
sec('Notes',fld('notes','Notes (about 3 lines print on page 1; the rest goes to page 2)','area',null,1));
sec('Attached',chk('c1','Blast Record'),chk('c2','Drill report'),chk('c3','Additional notes'),chk('c4','Other docs'),fld('docsOther','Other docs (specify)'));
sec('Signature',pad('sg',600,200,[]));

const num=s=>parseFloat(String(s).replace(',','.')),K$=k=>$('[data-k='+k+']');
function upd(){const t=num(K$('totW').value),r=num(K$('volume').value);K$('pf').value=t>0&&r>0?(t/r).toFixed(2):'';K$('ref').closest('label').classList.toggle('hide',!K$('ref').value);[['material','matOther'],['prim','primOther'],['stem','stemOther']].forEach(([a,c])=>K$(c).closest('label').classList.toggle('hide',K$(a).value!='Other'))}
const collect=()=>{const v={};document.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.type=='checkbox'?e.checked:e.value);return v};
function save(){try{const v=collect();v._sk=pads.sk.c.toDataURL();v._sg=pads.sg.c.toDataURL();localStorage.setItem(K,JSON.stringify(v))}catch(e){}}
$('#form').addEventListener('input',()=>{upd();later()});
try{const v=JSON.parse(localStorage.getItem(K)||'null');if(v){document.querySelectorAll('[data-k]').forEach(e=>{const x=v[e.dataset.k];if(x!==undefined)e.type=='checkbox'?e.checked=x:e.value=x});['sk','sg'].forEach(k=>v['_'+k]&&pads[k].load(v['_'+k]))}}catch(e){}
upd();
function reset(){document.querySelectorAll('[data-k]').forEach(e=>e.type=='checkbox'?e.checked=false:e.value='');pads.sk.clr();pads.sg.clr();try{localStorage.removeItem(K)}catch(e){}upd();scrollTo(0,0)}
let armed=0;$('#new').onclick=function(){if(!armed){armed=1;this.textContent='Tap again to clear';setTimeout(()=>{armed=0;this.textContent='New report'},3000);return}armed=0;this.textContent='New report';reset()};

const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',await b.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('blast',1);r.onupgradeneeded=()=>r.result.createObjectStore('reports',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction('reports',m),q=f(t.objectStore('reports'));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};

 try{const v=collect();v._id='BR-'+Date.now().toString(36).toUpperCase();v._created=new Date().toISOString();
  const nm=('Blast_Report_'+(v.date||'nodate')+(v.blastNo?'_'+v.blastNo:'')+'_'+v._id+'.pdf').replace(/[^\w.-]+/g,'_');
  const blob=build(v).output('blob'),hash=await sha(blob);
  await tx('readwrite',s=>s.add({id:v._id,created:v._created,date:v.date,blastNo:v.blastNo,project:v.project,ref:v.ref,name:nm,hash,pdf:blob,data:v}));
